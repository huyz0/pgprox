[package]
name = "pgprox-session"
description = "The per-client state machine and the relay loop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
pgprox-core = { path = "../pgprox-core" }
pgprox-proto = { path = "../pgprox-proto" }
pgprox-pool = { path = "../pgprox-pool" }
pgprox-route = { path = "../pgprox-route" }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
async-trait.workspace = true

[dev-dependencies]
pgprox-core = { path = "../pgprox-core", features = ["test-fakes"] }
proptest.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-util", "time", "test-util"] }

[lints]
workspace = true
