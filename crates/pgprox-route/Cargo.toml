[package]
name = "pgprox-route"
description = "Statement classification, replica eligibility and target selection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
pgprox-core = { path = "../pgprox-core" }
async-trait.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
# Allocation budgets, counted per thread. See docs/internal/standards/testing.md.
allocation-counter = "0.8"
pgprox-core = { path = "../pgprox-core", features = ["test-fakes"] }
proptest.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true

[[bench]]
name = "hot_paths"
harness = false
