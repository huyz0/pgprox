[package]
name = "pgprox-proto"
description = "Postgres wire protocol codec, both directions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Tests that need Docker or a real Postgres. Excluded from tier 1.
integration = []

[dependencies]
pgprox-core = { path = "../pgprox-core" }
thiserror.workspace = true

[dev-dependencies]
# Allocation budgets, asserted as counts. Deterministic where a wall-clock
# measurement on a shared runner is noise. See standards/testing.md.
dhat = "0.3"
# Shared probe classification, so the 57P03 bug lives in one place.
pgprox-testkit = { path = "../pgprox-testkit" }
proptest.workspace = true
pgprox-core = { path = "../pgprox-core", features = ["test-fakes"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true
