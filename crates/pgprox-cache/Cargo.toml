[package]
name = "pgprox-cache"
description = "Query result cache with bounded staleness. See ADR 0021."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
pgprox-core = { path = "../pgprox-core" }

[dev-dependencies]
pgprox-core = { path = "../pgprox-core", features = ["test-fakes"] }
tokio = { workspace = true, features = ["rt", "macros"] }
# Allocation budgets, counted per thread. See docs/internal/standards/testing.md.
allocation-counter = "0.8"

[[bench]]
name = "hot_paths"
harness = false

[lints]
workspace = true
