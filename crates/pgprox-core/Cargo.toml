[package]
name = "pgprox-core"
description = "Contracts shared by every pgprox crate: traits, DTOs, errors, IDs, and fakes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Fakes are available to downstream crates only when they ask, but always
# compiled during this crate's own tests so they are covered by the gate.
test-fakes = []

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true
