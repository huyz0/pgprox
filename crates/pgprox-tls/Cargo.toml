[package]
name = "pgprox-tls"
description = "TLS configuration for pgprox, with a FIPS build variant."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Swaps in the FIPS 140-3 validated aws-lc-rs module. The build needs cmake, Go
# and clang, which the default build does not, so this is a separate image.
fips = ["rustls/fips", "aws-lc-rs/fips"]
integration = []

[dependencies]
pgprox-core = { path = "../pgprox-core" }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
# PEM parsing lives in rustls-pki-types now; rustls-pemfile is unmaintained
# per RustSec. Same maintainers, same code, current home.
rustls-pki-types = { version = "1", features = ["std"] }
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
thiserror.workspace = true
# Only for the leaf certificate's own notBefore/notAfter, checked before a
# read certificate is served. Already present in the lockfile via rcgen's
# dev-dependency graph; used here as a real dependency rather than hand-rolled
# ASN.1 parsing for two fields.
x509-parser = "0.18"

[dev-dependencies]
rcgen = "0.14"
tokio = { workspace = true, features = ["rt", "macros"] }
# For building a certificate with a validity window other than rcgen's own
# wide default, which every other test in this crate relies on staying valid
# forever. Already in the lockfile via rcgen's own dependency.
time = "0.3"

[lints]
workspace = true
