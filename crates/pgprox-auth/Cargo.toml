[package]
name = "pgprox-auth"
description = "JWT extraction, sidecar credential resolution, and the grant cache."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Tests that need a real socket or the mock sidecar process. Pulls in what the
# mock server needs, so an ordinary build carries neither.
integration = ["dep:tokio-stream", "tokio/rt-multi-thread"]
# Same FIPS module as pgprox-tls, so the two cannot diverge on which provider
# computed a hash. See ADR 0010.
fips = ["aws-lc-rs/fips"]

# A test-support binary, not a product one. required-features keeps it out of
# ordinary builds, and making it a bin rather than an example means the test run
# builds it once instead of every test shelling out to cargo and contending on
# the build lock.
[[bin]]
name = "mock_sidecar"
required-features = ["integration"]

[dependencies]
pgprox-core = { path = "../pgprox-core" }
async-trait.workspace = true
thiserror.workspace = true
prost = "0.14"
tonic = { version = "0.14", default-features = false, features = ["codegen", "channel", "router", "server", "transport"] }
tonic-prost = "0.14"
tokio = { workspace = true, features = ["rt", "net", "sync", "time", "macros"] }
tokio-stream = { version = "0.1", features = ["net"], optional = true }
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
# HMAC, PBKDF2 and SHA-256 all come from one provider, the same one pgprox-tls
# uses, so a FIPS build does not have two crypto stacks to validate.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
sha2 = "0.10"
subtle = "2"
base64 = "0.22"
serde_json = "1"
tracing = "0.1"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
# Allocation budgets. See docs/internal/standards/testing.md.
dhat = "0.3"
base64 = "0.22"
# Shared probe classification, so the 57P03 bug lives in one place.
pgprox-testkit = { path = "../pgprox-testkit" }
pgprox-core = { path = "../pgprox-core", features = ["test-fakes"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }

[lints]
workspace = true
