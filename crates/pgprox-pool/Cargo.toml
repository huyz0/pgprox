[package]
name = "pgprox-pool"
description = "Upstream pools, lifecycle, idle reap, pinning and prepared statement mapping."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
pgprox-core = { path = "../pgprox-core" }
async-trait.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
# Allocation budgets. See standards/testing.md.
dhat = "0.3"
pgprox-core = { path = "../pgprox-core", features = ["test-fakes"] }
proptest.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }

[lints]
workspace = true

[[bench]]
name = "hot_paths"
harness = false
