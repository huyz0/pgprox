[package]
name = "pgprox-cluster"
description = "Membership, quota leases, tenant placement and shed decisions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# The deterministic simulation, for crates that want to drive this one in a
# test. Always compiled during this crate's own tests.
sim = []

[dependencies]
pgprox-core = { path = "../pgprox-core" }
async-trait.workspace = true
thiserror.workspace = true

[dev-dependencies]
pgprox-core = { path = "../pgprox-core", features = ["test-fakes"] }
proptest.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
