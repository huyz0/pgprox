# Git hooks. This is the binding enforcement layer: whatever wrote the code,
# agent or human, on whatever editor, it passes through here.
#
# Agent hooks (.claude/settings.json and equivalents) call these same scripts
# for faster in-session feedback. They are an accelerator, never a second
# implementation, so a developer on a tool without hook support works under the
# same rules with slower feedback.
#
# Install once: lefthook install

pre-commit:
  parallel: true
  commands:
    fmt:
      run: scripts/check-fmt.sh

    drift:
      # Cheap, and catches the failure where a vendor file forks from canonical
      # source. Runs on every commit rather than only when those files change,
      # because a symlink can break without any tracked file being touched.
      run: scripts/check-drift.sh

    secrets:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --redact --no-banner
        else
          echo "gitleaks not installed, skipping. Install it: https://github.com/gitleaks/gitleaks"
        fi

    clippy:
      glob: "*.rs"
      run: scripts/check-crate.sh

    coverage:
      # The 95% gate. Tier 1 alone carries this number, so it never waits on
      # Docker. Budget for the whole pre-commit run is 2 minutes; see
      # standards/testing.md for what keeps it there.
      glob: "*.rs"
      run: scripts/check-coverage.sh

commit-msg:
  commands:
    task-id:
      # One task, one commit. The subject references the backlog task so the
      # history stays traceable to the plan.
      run: |
        head -1 "$1" | grep -qE '^(M-?[0-9]+\.[0-9]+|Merge|Revert)' || {
          echo "Commit subject must start with a backlog task ID, e.g. 'M-1.7: ...'"
          echo "See standards/behavior.md"
          exit 1
        }

pre-push:
  commands:
    full-coverage:
      run: scripts/check-coverage.sh
