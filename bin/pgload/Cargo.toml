[package]
name = "pgload"
description = "The load client: replays the reference workload against a proxy or a database."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Same split as bin/pgprox: a library target holding everything a test can
# call, and a binary that holds nothing.
[lib]
name = "pgload_app"
path = "src/lib.rs"

[[bin]]
name = "pgload"
path = "src/main.rs"

[dependencies]
pgprox-load = { path = "../../crates/pgprox-load" }
pgprox-proto = { path = "../../crates/pgprox-proto" }
thiserror.workspace = true
# TLS for the load client. `ring` is not in the picture: the workspace's
# provider is aws-lc-rs and a second one in the same process is a way to be
# surprised. See src/tls.rs for why this client verifies nothing.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
pgprox-core = { path = "../../crates/pgprox-core" }
# A certificate for the TLS tests. Generated per run rather than checked in,
# for the same reason the e2e stack generates its own.
rcgen = "0.14"
pgprox-tls = { path = "../../crates/pgprox-tls" }

tempfile.workspace = true

[lints]
workspace = true
