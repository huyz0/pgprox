[package]
name = "pgprox"
description = "The proxy binary: the one place concrete types meet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A library target with the wiring in it, and a binary that does nothing a test
# cannot call. Only main.rs is excluded from coverage, and it is five lines, so
# the exclusion is worth almost nothing to hide behind.
[lib]
name = "pgprox_app"
path = "src/lib.rs"

[[bin]]
name = "pgprox"
path = "src/main.rs"

[features]
default = []
# The FIPS build, forwarded to every crate that holds a crypto provider. Set
# here so one flag on the binary cannot leave half the process on a validated
# module and half on the default one.
fips = ["pgprox-tls/fips", "pgprox-auth/fips", "aws-lc-rs/fips"]

[dependencies]
pgprox-core = { path = "../../crates/pgprox-core" }
pgprox-admin = { path = "../../crates/pgprox-admin" }
pgprox-auth = { path = "../../crates/pgprox-auth" }
pgprox-cluster = { path = "../../crates/pgprox-cluster" }
pgprox-config = { path = "../../crates/pgprox-config" }
pgprox-observe = { path = "../../crates/pgprox-observe" }
pgprox-pool = { path = "../../crates/pgprox-pool" }
pgprox-proto = { path = "../../crates/pgprox-proto" }
pgprox-route = { path = "../../crates/pgprox-route" }
pgprox-session = { path = "../../crates/pgprox-session" }
pgprox-tls = { path = "../../crates/pgprox-tls" }
async-trait.workspace = true
# The same provider rustls and the SCRAM implementation use: a cancel key is a
# bearer token, and the binary needs system entropy to issue one.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
axum = { workspace = true, features = ["json", "query", "tokio", "http1"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
base64 = "0.22"
tokio-rustls = { version = "0.26", default-features = false }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros", "signal"] }

[dev-dependencies]
pgprox-core = { path = "../../crates/pgprox-core", features = ["test-fakes"] }
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
