name: ci

# CI calls scripts/ rather than reimplementing the checks. If a check exists in
# two places it drifts, and the version that matters is whichever one the
# developer did not run.

on:
  push:
    branches: [main]
  pull_request:
  # Tier 3, which plan.md puts on a schedule rather than on every commit. One
  # job hangs off this: the FIPS variant, which builds AWS-LC from source and
  # is minutes rather than seconds.
  schedule:
    - cron: "17 3 * * *"
  # And by hand, because a nightly job nobody can trigger is a job that is
  # first looked at on the day of a release.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  tier1:
    name: tier 1 (the pre-commit gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup show && rustup component add rustfmt clippy llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest,cargo-deny

      - run: scripts/check-fmt.sh
      - run: scripts/check-drift.sh
      # Non-negotiable 7, enforced rather than held up by one unit test. M13.3.
      - run: scripts/check-secrets.sh
      # Non-negotiable 5, which check-layering.sh was credited with and does
      # not check: it enforces the crate dependency rule, a different rule. M13.4.
      - run: scripts/check-sans-io.sh
      # The five conditions on the unsafe exception. Per commit rather than
      # nightly, because an `#[allow(unsafe_code)]` is one line. M27.1.
      - run: scripts/check-unsafe.sh
      - run: scripts/check-layering.sh
      # The most repeated defect in this project: correct, tested code that
      # nothing reaches. Four instances across M15 and M16, the last committed
      # one commit after its author wrote that a primitive with no caller is
      # the defect the milestone existed to fix. M16.9.
      - run: scripts/check-wired.sh
      - run: scripts/check-crate.sh
      - run: scripts/check-coverage.sh

  fips:
    name: tier 3 - the FIPS variant
    # Nightly and on request, not on every commit. aws-lc-fips-sys compiles
    # AWS-LC from source and runs its FIPS module through `delocate`, which is
    # minutes of build for a feature that changes rarely. Tier 1 already
    # compiles the feature through `clippy --all-features`; what this adds is
    # running the test that asks a real configuration whether it reports FIPS.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # clang because gcc emits `.data.rel.ro.local` for the FIPS module's
      # relocatable tables once optimisation is on, and the delocate step
      # refuses any .data section in the module. See scripts/fips-check.sh.
      - name: Install the FIPS toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake clang golang make
      - run: scripts/fips-check.sh

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version comes from Cargo.toml through scripts/msrv.sh rather than
      # being written here. A pin recorded in two places drifts, and the copy
      # that drifts is the one nobody runs.
      - name: Install the pinned toolchain
        run: |
          msrv="$(scripts/msrv.sh)"
          echo "building on $msrv"
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"
      - uses: Swatinem/rust-cache@v2
      # --all-targets so tests and benches are compiled too. A crate whose
      # library builds on the MSRV and whose tests do not is a crate nobody can
      # develop on the version this claims to support.
      - run: cargo check --workspace --all-targets

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny
        # The same script the pre-commit hook runs, so the two cannot drift.
        run: scripts/check-deps.sh

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  performance:
    name: instruction counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Callgrind is the whole measurement: without it this job would report
      # nothing and pass, which is worse than not running.
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      # The allocation budgets are ordinary tests and already run in tier 1.
      # This is the other half of the hot-path discipline: work that got more
      # expensive without allocating.
      - run: scripts/bench.sh

  fuzz:
    name: tier 3 - the fuzzers
    runs-on: ubuntu-latest
    # Nightly and on demand, alongside the FIPS build, because a fuzzer's value
    # is in the hours it accumulates rather than in blocking a commit. Five
    # minutes per target and three targets, so a scheduled run is a quarter of an
    # hour.
    #
    # `pgprox-proto`'s own rules say a malformed frame must not take down a node
    # serving 100k connections, and that this is fuzzed rather than assumed.
    # Until `M10.2` nothing ran the fuzzer, so it was assumed.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Install the nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
      - run: scripts/fuzz.sh 300
      # The input that crashed it, kept. Without this a find is a red run and a
      # log line, and the bytes that caused it are deleted with the runner. The
      # artifact replays with `cargo +nightly fuzz run <target> <path>`.
      - name: Keep what it found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: warn

  miri:
    name: tier 3 - miri
    runs-on: ubuntu-latest
    # Nightly and on demand, alongside the fuzzers and the mutation run. Miri
    # interprets rather than executes, so a suite it runs takes minutes rather
    # than seconds, and what it buys is the only mechanical check on an unsafe
    # block's argument that exists.
    #
    # The job is here before any crate needs it, and `scripts/check-unsafe.sh`
    # is what keeps the two in step: a crate that grows an `unsafe` block and is
    # not named below fails the pre-commit gate. Adding the job afterwards would
    # mean the first unsafe in this repo landed with nothing verifying it, which
    # is the order `M13` is about.
    #
    # `-p` per crate rather than `--workspace`: Miri cannot run a test that
    # opens a socket or spawns a process, and most of this workspace does. The
    # list is the crates that hold unsafe, which today is none.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Install the nightly toolchain with Miri
        run: |
          rustup toolchain install nightly --profile minimal --component miri
          rustup +nightly component add miri
      - uses: Swatinem/rust-cache@v2
      - run: scripts/miri.sh

  mutants:
    name: tier 3 - mutation testing
    runs-on: ubuntu-latest
    # Nightly, because a mutant is a full build and test run and there are
    # roughly three thousand of them across all fourteen crates. Coverage says
    # a line ran; this says the line mattered, and `standards/testing.md` has
    # claimed it runs since M-1.
    #
    # Said "nine hundred across the four sans-I/O crates" until M14, which is
    # what the list held then. M13.4 made every crate sans-I/O and enforced it,
    # so the criterion selected all fourteen while the array still selected
    # four; M14 closed that and this sentence with it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - run: scripts/mutants.sh
      # The outcomes, kept, because the interesting part of a failing run is
      # which mutant lived and where, and that is a file rather than a line of
      # log output.
      - name: Keep the outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-outcomes
          path: target/mutants-*/outcomes.json
          if-no-files-found: warn

  milestone:
    name: milestone completion condition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show && rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      # Every gate for every milestone that has closed, in order. Each passed on
      # the commit that closed it, so a failure here is a regression rather than
      # unfinished work, and all of them together take less time than the
      # coverage job.
      #
      # Three of these ran here until `M10.1` and the other eight did not, which
      # made them a record of what was once true while the roadmap cited them as
      # evidence. `scripts/check-drift.sh` now fails when a gate is not named
      # here, so the next one cannot be forgotten.
      #
      # The parts that need Docker or a driver toolchain are in the scripts these
      # call out to and are not run here: e2e.sh, scale.sh, conformance.sh and
      # rolling-upgrade.sh all want a stack.
      # Before the gates, because it is the one that decides whether the rest of
      # this job means anything. Each case breaks an artefact and asserts a
      # non-zero exit, so a gate that reports FAIL and returns 0 is caught here
      # rather than by whoever eventually reads the log. M12.1.
      - name: the gates can fail
        run: tests/gates/negative.sh
      - name: M-1
        run: scripts/m-1-complete.sh
      - name: M0
        run: scripts/m0-complete.sh
      - name: M1R
        run: scripts/m1r-complete.sh
      - name: M1F
        run: scripts/m1f-complete.sh
      - name: M3
        run: scripts/m3-complete.sh
      - name: M4
        run: scripts/m4-complete.sh
      - name: M5
        run: scripts/m5-complete.sh
      - name: M6
        run: scripts/m6-complete.sh
      - name: M7
        run: scripts/m7-complete.sh
      - name: M8
        run: scripts/release-check.sh
      - name: M9
        run: scripts/m9-complete.sh
      # The gate for the milestone that exists because gates were not running.
      # It checks that the other twelve are named here, so this line is the one
      # that keeps the check from being able to pass by describing nothing.
      - name: M10
        run: scripts/m10-complete.sh
      # This ran with `continue-on-error` while M11 was open, so that writing
      # the gate early meant watching it go green a check at a time. M11 closed
      # in M11.11 and the flag outlived its reason, which made it an instance of
      # M12's own subject: a gate that runs and cannot fail. It enforces now.
      - name: M11
        run: scripts/m11-complete.sh
      # M12's gate runs tests/gates/negative.sh itself, so the step above it and
      # this one overlap on purpose: the suite is the milestone's deliverable and
      # a gate that only described it would be the defect M12 exists to remove.
      - name: M12
        run: scripts/m12-complete.sh
      - name: M13
        run: scripts/m13-complete.sh
      - name: M14
        run: scripts/m14-complete.sh
      # Every check in this one runs a named test and reads its exit status,
      # which is `M12.8`'s rule taken literally: a finding is fixed when a test
      # would fail if it came back, so the gate runs the test rather than
      # looking for the file it lives in.
      - name: M15
        run: scripts/m15-complete.sh
      # M16 reports its blocked half rather than asserting it. The 100k run
      # with a large result set needs three machines, so a gate that dropped it
      # would turn a milestone that is two thirds done into one reporting green.
      - name: M16
        run: scripts/m16-complete.sh
      - name: M17
        run: scripts/m17-complete.sh
      # M18's own gate, and it is part of the milestone rather than an
      # afterthought for the reason M18.3 is about: until it existed, a
      # milestone could close with nothing to run and nothing objected.
      - name: M18
        run: scripts/m18-complete.sh
      # M19 is open, and its gate runs anyway. It checks what has landed rather
      # than what is planned, so it passes at every point; a gate that waited
      # for the milestone to close would be the defect M18.3 fixed, on a
      # schedule.
      - name: M19
        run: scripts/m19-complete.sh
      - name: M20
        run: scripts/m20-complete.sh
      # M21 is open, and its gate runs anyway, on the same terms M19 and M20
      # were: it checks what has landed rather than what is planned.
      - name: M21
        run: scripts/m21-complete.sh
      # M22 is open, and its gate runs anyway, on the same terms M19, M20 and
      # M21 were: it checks what has landed rather than what is planned.
      - name: M22
        run: scripts/m22-complete.sh
      # M23 is open, and its gate runs anyway, on the same terms M19 through
      # M22 were: it checks what has landed rather than what is planned.
      - name: M23
        run: scripts/m23-complete.sh
      # M24 is open, and its gate runs anyway, on the same terms M19 through
      # M23 were: it checks what has landed rather than what is planned. Its
      # first check is that nothing ticked in the backlog is missing from it,
      # which is what stops "what has landed" from meaning "whatever is easy".
      - name: M24
        run: scripts/m24-complete.sh
      # M25 is open, and its gate runs anyway, on M24's terms: it checks what
      # has landed, and refuses to pass with a ticked task it does not name.
      - name: M25
        run: scripts/m25-complete.sh
      # M26 is open, and its gate runs anyway, on M24's terms. Its own numbers
      # live in product/perf/baseline.json and are checked by scripts/bench.sh,
      # which is a separate CI job because it needs valgrind.
      - name: M26
        run: scripts/m26-complete.sh
      # M27 is open, and its gate runs anyway, on M24's terms.
      - name: M27
        run: scripts/m27-complete.sh
      # M28 is open, and its gate runs anyway, on M24's terms.
      - name: M28
        run: scripts/m28-complete.sh
