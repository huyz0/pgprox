name: ci

# CI calls scripts/ rather than reimplementing the checks. If a check exists in
# two places it drifts, and the version that matters is whichever one the
# developer did not run.

on:
  push:
    branches: [main]
  pull_request:
  # Tier 3, which plan.md puts on a schedule rather than on every commit. One
  # job hangs off this: the FIPS variant, which builds AWS-LC from source and
  # is minutes rather than seconds.
  schedule:
    - cron: "17 3 * * *"
  # And by hand, because a nightly job nobody can trigger is a job that is
  # first looked at on the day of a release.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  tier1:
    name: tier 1 (the pre-commit gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup show && rustup component add rustfmt clippy llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest,cargo-deny

      - run: scripts/check-fmt.sh
      - run: scripts/check-drift.sh
      - run: scripts/check-layering.sh
      - run: scripts/check-crate.sh
      - run: scripts/check-coverage.sh

  fips:
    name: tier 3 - the FIPS variant
    # Nightly and on request, not on every commit. aws-lc-fips-sys compiles
    # AWS-LC from source and runs its FIPS module through `delocate`, which is
    # minutes of build for a feature that changes rarely. Tier 1 already
    # compiles the feature through `clippy --all-features`; what this adds is
    # running the test that asks a real configuration whether it reports FIPS.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # clang because gcc emits `.data.rel.ro.local` for the FIPS module's
      # relocatable tables once optimisation is on, and the delocate step
      # refuses any .data section in the module. See scripts/fips-check.sh.
      - name: Install the FIPS toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake clang golang make
      - run: scripts/fips-check.sh

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version comes from Cargo.toml through scripts/msrv.sh rather than
      # being written here. A pin recorded in two places drifts, and the copy
      # that drifts is the one nobody runs.
      - name: Install the pinned toolchain
        run: |
          msrv="$(scripts/msrv.sh)"
          echo "building on $msrv"
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"
      - uses: Swatinem/rust-cache@v2
      # --all-targets so tests and benches are compiled too. A crate whose
      # library builds on the MSRV and whose tests do not is a crate nobody can
      # develop on the version this claims to support.
      - run: cargo check --workspace --all-targets

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny
        # The same script the pre-commit hook runs, so the two cannot drift.
        run: scripts/check-deps.sh

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  performance:
    name: instruction counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Callgrind is the whole measurement: without it this job would report
      # nothing and pass, which is worse than not running.
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      # The allocation budgets are ordinary tests and already run in tier 1.
      # This is the other half of the hot-path discipline: work that got more
      # expensive without allocating.
      - run: scripts/bench.sh

  milestone:
    name: milestone completion condition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show && rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: M-1
        run: scripts/m-1-complete.sh
      # The gates for the milestones that have closed. Each one passed on the
      # commit that closed it, so a failure here is a regression rather than
      # unfinished work. The parts that need Docker are in the scripts these
      # call out to and are not run here: e2e.sh and scale.sh want a stack.
      - name: M6
        run: scripts/m6-complete.sh
      - name: M7
        run: scripts/m7-complete.sh
