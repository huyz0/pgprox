name: ci

# CI calls scripts/ rather than reimplementing the checks. If a check exists in
# two places it drifts, and the version that matters is whichever one the
# developer did not run.

on:
  push:
    branches: [main]
  pull_request:
  # Tier 3, which plan.md puts on a schedule rather than on every commit. One
  # job hangs off this: the FIPS variant, which builds AWS-LC from source and
  # is minutes rather than seconds.
  schedule:
    - cron: "17 3 * * *"
  # And by hand, because a nightly job nobody can trigger is a job that is
  # first looked at on the day of a release.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  tier1:
    name: tier 1 (the pre-commit gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup show && rustup component add rustfmt clippy llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest,cargo-deny

      - run: scripts/check-fmt.sh
      - run: scripts/check-drift.sh
      - run: scripts/check-layering.sh
      - run: scripts/check-crate.sh
      - run: scripts/check-coverage.sh

  fips:
    name: tier 3 - the FIPS variant
    # Nightly and on request, not on every commit. aws-lc-fips-sys compiles
    # AWS-LC from source and runs its FIPS module through `delocate`, which is
    # minutes of build for a feature that changes rarely. Tier 1 already
    # compiles the feature through `clippy --all-features`; what this adds is
    # running the test that asks a real configuration whether it reports FIPS.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # clang because gcc emits `.data.rel.ro.local` for the FIPS module's
      # relocatable tables once optimisation is on, and the delocate step
      # refuses any .data section in the module. See scripts/fips-check.sh.
      - name: Install the FIPS toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake clang golang make
      - run: scripts/fips-check.sh

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version comes from Cargo.toml through scripts/msrv.sh rather than
      # being written here. A pin recorded in two places drifts, and the copy
      # that drifts is the one nobody runs.
      - name: Install the pinned toolchain
        run: |
          msrv="$(scripts/msrv.sh)"
          echo "building on $msrv"
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"
      - uses: Swatinem/rust-cache@v2
      # --all-targets so tests and benches are compiled too. A crate whose
      # library builds on the MSRV and whose tests do not is a crate nobody can
      # develop on the version this claims to support.
      - run: cargo check --workspace --all-targets

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny
        # The same script the pre-commit hook runs, so the two cannot drift.
        run: scripts/check-deps.sh

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  performance:
    name: instruction counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Callgrind is the whole measurement: without it this job would report
      # nothing and pass, which is worse than not running.
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      # The allocation budgets are ordinary tests and already run in tier 1.
      # This is the other half of the hot-path discipline: work that got more
      # expensive without allocating.
      - run: scripts/bench.sh

  fuzz:
    name: tier 3 - the fuzzers
    runs-on: ubuntu-latest
    # Nightly and on demand, alongside the FIPS build, because a fuzzer's value
    # is in the hours it accumulates rather than in blocking a commit. Five
    # minutes per target and three targets, so a scheduled run is a quarter of an
    # hour.
    #
    # `pgprox-proto`'s own rules say a malformed frame must not take down a node
    # serving 100k connections, and that this is fuzzed rather than assumed.
    # Until `M10.2` nothing ran the fuzzer, so it was assumed.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Install the nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
      - run: scripts/fuzz.sh 300
      # The input that crashed it, kept. Without this a find is a red run and a
      # log line, and the bytes that caused it are deleted with the runner. The
      # artifact replays with `cargo +nightly fuzz run <target> <path>`.
      - name: Keep what it found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: warn

  mutants:
    name: tier 3 - mutation testing
    runs-on: ubuntu-latest
    # Nightly, because a mutant is a full build and test run and there are
    # nine hundred of them across the four sans-I/O crates. Coverage says a
    # line ran; this says the line mattered, and `standards/testing.md` has
    # claimed it runs since M-1.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - run: scripts/mutants.sh
      # The outcomes, kept, because the interesting part of a failing run is
      # which mutant lived and where, and that is a file rather than a line of
      # log output.
      - name: Keep the outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-outcomes
          path: target/mutants-*/outcomes.json
          if-no-files-found: warn

  milestone:
    name: milestone completion condition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show && rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      # Every gate for every milestone that has closed, in order. Each passed on
      # the commit that closed it, so a failure here is a regression rather than
      # unfinished work, and all of them together take less time than the
      # coverage job.
      #
      # Three of these ran here until `M10.1` and the other eight did not, which
      # made them a record of what was once true while the roadmap cited them as
      # evidence. `scripts/check-drift.sh` now fails when a gate is not named
      # here, so the next one cannot be forgotten.
      #
      # The parts that need Docker or a driver toolchain are in the scripts these
      # call out to and are not run here: e2e.sh, scale.sh, conformance.sh and
      # rolling-upgrade.sh all want a stack.
      - name: M-1
        run: scripts/m-1-complete.sh
      - name: M0
        run: scripts/m0-complete.sh
      - name: M1R
        run: scripts/m1r-complete.sh
      - name: M1F
        run: scripts/m1f-complete.sh
      - name: M3
        run: scripts/m3-complete.sh
      - name: M4
        run: scripts/m4-complete.sh
      - name: M5
        run: scripts/m5-complete.sh
      - name: M6
        run: scripts/m6-complete.sh
      - name: M7
        run: scripts/m7-complete.sh
      - name: M8
        run: scripts/release-check.sh
      - name: M9
        run: scripts/m9-complete.sh
      # The gate for the milestone that exists because gates were not running.
      # It checks that the other twelve are named here, so this line is the one
      # that keeps the check from being able to pass by describing nothing.
      - name: M10
        run: scripts/m10-complete.sh
