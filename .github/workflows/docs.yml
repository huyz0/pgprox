# Builds the documentation site and publishes it to GitHub Pages.
#
# Separate from ci.yml because it has a different toolchain and a different
# failure meaning: a broken doc build should not read as a broken proxy, and a
# red proxy build should not stop a typo fix reaching the site.
#
# Pages needs to be enabled once, in Settings > Pages, with Source set to
# GitHub Actions. Until that is done this workflow builds and the deploy step
# fails, which is the honest failure: the site is not published and the log
# says why.
name: docs

on:
  push:
    branches: [main]
    # Only when something the site is built from moves. The proxy's own source
    # does not appear here, and a Rust change that does not touch the docs has
    # no reason to rebuild them.
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# One deployment at a time, and a queued one is not worth running once a newer
# commit has landed. `cancel-in-progress` is false so a deploy already writing
# to Pages is allowed to finish rather than leaving it half written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # The lockfile is in docs/, not at the root, so the cache key has to
          # be told where to look or it silently caches nothing.
          cache-dependency-path: docs/package-lock.json
      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails if the two disagree, so a site cannot be published from a
      # dependency tree nobody committed.
      # The pages and the toolchain that builds them are both in docs/, which
      # is why this runs from there and the artifact comes from docs/dist.
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    name: publish
    # Pull requests build and do not publish. A fork opening one must not be
    # able to write to the site.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # No `timeout:` here, and that is a finding rather than an omission.
      #
      # The action creates a Pages deployment and polls until Pages reports it
      # finished. Ten minutes is not its default, it is its ceiling, in v4 and
      # in the v5 this now pins:
      #
      #   const MAX_TIMEOUT = 600000
      #   this.timeout = Math.min(timeoutInput, MAX_TIMEOUT)
      #
      # `M66.0` set it to thirty minutes and the next run timed out at 13:07:53
      # and 13:17:55, ten minutes to the second. The action prints
      # "timeout value is greater than the allowed maximum" when it clamps, and
      # that warning was in the log the whole time.
      #
      # So a Pages backend slower than ten minutes cannot be absorbed here. The
      # deploy time for this repository drifted from 3m12s to over ten minutes
      # across pushes whose content barely moved: the artifact is 59 files and
      # 2.4 MB and the count did not change when it broke.
      #
      # Recovery is a new commit, not a re-run. Pages keys the deployment by
      # `pages_build_version`, which is the commit SHA, so a re-run for a SHA
      # whose deployment was already cancelled fails in nine seconds with
      # "Deployment cancelled." `M66.1`.
      - id: deploy
        uses: actions/deploy-pages@v5
