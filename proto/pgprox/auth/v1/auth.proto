syntax = "proto3";

// Credential resolution for pgprox.
//
// STATUS: FROZEN. Owned by this repository. See ADR 0017.
//
// Versioning rules, in force:
//   - Field numbers are never reused, even for a removed field.
//   - Fields are never removed, only deprecated.
//   - Anything optional in the proto is genuinely optional in the Rust type.
//   - Breaking changes get a new package version (auth.v2), not an edit here.
//
// A change here is a spec change first; use the contract-change skill.

package pgprox.auth.v1;

// Turns a client's token into the credentials for its database.
//
// The sidecar owns token validation. The proxy does not implement a second
// validator, because two validators that disagree about validity is a
// vulnerability rather than redundancy.
service CredentialResolver {
  rpc Resolve(ResolveRequest) returns (ResolveResponse);

  // Asks where a primary's topology stands now, without a token.
  //
  // For a connection that already authenticated: `Resolve` needs a token and
  // an established session holds a Grant, not a token, from the moment it
  // authenticated, so it has nothing left to re-resolve with. This is the
  // other half, and it deliberately answers a narrower question. See ADR
  // 0028: no ttl, no claims, nothing that could extend what a token was
  // originally granted. It says where the database is, not who may use it.
  //
  // Keyed by primary rather than by tenant, because a primary can host
  // thousands of tenant databases and a failover is answered once for all of
  // them rather than once per tenant.
  rpc RefreshTopology(RefreshTopologyRequest) returns (RefreshTopologyResponse);
}

message ResolveRequest {
  // The JWT, exactly as the client sent it in the password field.
  string token = 1;

  // The database the client asked for in its startup packet. The sidecar may
  // use it for policy; it is not necessarily the database finally connected to.
  string startup_database = 2;

  // The user the client asked for in its startup packet.
  string startup_user = 3;

  // Where the client connected from, for policy and audit.
  string client_address = 4;
}

message ResolveResponse {
  // Which tenant this token belongs to.
  string tenant_id = 1;

  // The primary, serving every write and any read not provably safe on a
  // replica.
  Backend primary = 2;

  // Read replicas, in no particular order. May be empty.
  repeated Backend replicas = 3;

  // How long the proxy may cache this grant. The proxy clamps it to the
  // earliest of this, the token's expiry, and its own configured maximum, so a
  // generous value here cannot extend a revoked token's life.
  uint32 ttl_seconds = 4;

  // Per-tenant pool tuning.
  PoolHints pool = 5;

  // Claims the sidecar parsed. Supplied so the proxy does not re-parse and
  // reach a different conclusion.
  ClaimSet claims = 6;
}

message RefreshTopologyRequest {
  // The primary as this process last knew it. Identifies which topology is
  // being asked about; it is not necessarily still the primary by the time
  // the sidecar answers, which is the whole point of asking.
  string primary_host = 1;
  uint32 primary_port = 2;
}

message RefreshTopologyResponse {
  // Where the primary is now. May name the same server the request did, if
  // nothing changed.
  Backend primary = 1;

  // Read replicas of the primary above, in no particular order. May be empty.
  repeated Backend replicas = 2;

  // Deliberately absent: ttl_seconds, pool hints, claims. This answers where
  // the database is, not who may use it or for how long. See ADR 0028.
}

message Backend {
  string host = 1;
  uint32 port = 2;
  string database = 3;
  string user = 4;

  // The role's password. Held as a SecretString on the Rust side: redacted in
  // Debug, zeroed on drop, and reachable only through an explicit call.
  string password = 5;

  TlsMode tls = 6;
}

enum TlsMode {
  // Proto3 requires a zero value. It maps to VERIFIED rather than DISABLED, so
  // a sidecar that omits the field cannot accidentally turn off TLS.
  TLS_MODE_UNSPECIFIED = 0;
  TLS_MODE_VERIFIED = 1;
  TLS_MODE_DISABLED = 2;
}

enum PoolMode {
  // Unspecified maps to TRANSACTION, the default that makes the connection
  // ratio work.
  POOL_MODE_UNSPECIFIED = 0;
  POOL_MODE_TRANSACTION = 1;
  POOL_MODE_SESSION = 2;
}

message PoolHints {
  // Cap on upstream connections for this tenant. Zero means unset.
  uint32 max_upstream = 1;

  PoolMode mode = 2;

  // statement_timeout for this tenant's upstream connections, in milliseconds.
  // Zero means unset.
  uint32 statement_timeout_ms = 3;
}

message ClaimSet {
  // The `sub` claim, if present.
  string subject = 1;

  // The `exp` claim as a Unix timestamp. Zero means the token does not expire,
  // which the proxy treats as "no expiry clamp" rather than "already expired".
  int64 expires_at_unix = 2;

  // The `iat` claim as a Unix timestamp. Zero means absent.
  int64 issued_at_unix = 3;
}
