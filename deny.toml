# Supply chain policy. Runs in CI; see standards/security.md.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licences only. A copyleft dependency in a proxy that ships as a
# binary to customers is a legal question we do not want to answer at 2am.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates are referenced by path and have no version by design.
# Inventing one to satisfy the ban would be a fiction the lockfile ignores.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Pinned to crates.io so a dependency cannot quietly start pulling from a git
# URL, which would sidestep both the advisory database and the licence check.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
