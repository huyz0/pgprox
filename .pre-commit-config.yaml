# Git hooks. This is the binding enforcement layer: whatever wrote the code,
# agent or human, on whatever editor, it passes through here.
#
# Agent hooks (.claude/settings.json and equivalents) call these same scripts
# for faster in-session feedback. They are an accelerator, never a second
# implementation, so a developer on a tool without hook support works under the
# same rules with slower feedback.
#
# Install once:  pre-commit install
# (installs pre-commit, commit-msg, and pre-push hooks in one go)

default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  # Generic hygiene. Cheap, and catches the class of mistake that is annoying
  # to find later: a broken YAML in the CI workflow, a stray merge marker, a
  # private key committed by accident.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'   # trailing double-space is meaningful in Markdown
      - id: end-of-file-fixer
      - id: check-yaml
        # `---` separators are how a Kubernetes manifest carries a Service and
        # the Deployment behind it in one file, which is the shape every
        # `kubectl apply -f` expects.
        args: [--allow-multiple-documents]
        # Helm templates are Go templates that produce YAML, not YAML. A
        # conditional block starts with `{{- if ...}}` and a parser sees a flow
        # mapping that never closes. `helm lint` and `helm template` are what
        # check these, and scripts/release-check.sh runs both.
        exclude: '^deploy/helm/.*/templates/'
      - id: check-json
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Everything below calls a script in scripts/. CI calls the same scripts. A
  # check implemented in two places drifts, and the version that matters is
  # whichever one the developer did not run.
  - repo: local
    hooks:
      - id: drift
        name: derived files match canonical source
        entry: scripts/check-drift.sh
        language: script
        pass_filenames: false
        always_run: true
        # Runs on every commit rather than only when AGENTS.md changes, because
        # a symlink can break without any tracked file being touched.

      - id: portability
        name: system stays tool-agnostic
        entry: scripts/check-portability.sh
        language: script
        pass_filenames: false
        files: '(AGENTS\.md|SKILL\.md|^scripts/|\.pre-commit-config\.yaml)$'

      - id: supply-chain
        name: cargo deny (advisories, licences, bans, sources)
        entry: scripts/check-deps.sh
        language: script
        pass_filenames: false
        # Only when a manifest or the lockfile moves, so an ordinary commit
        # pays nothing. This ran only in CI and the milestone gates before, and
        # went red for several commits without anyone noticing.
        files: '(Cargo\.toml|Cargo\.lock|deny\.toml)$'

      - id: layering
        name: crate dependency rule
        entry: scripts/check-layering.sh
        language: script
        pass_filenames: false
        files: 'Cargo\.toml$'

      - id: fmt
        name: cargo fmt
        entry: scripts/check-fmt.sh
        language: script
        pass_filenames: false
        files: '\.rs$'

      - id: clippy
        name: cargo clippy
        entry: scripts/check-crate.sh
        language: script
        pass_filenames: false
        files: '\.rs$'

      - id: coverage
        name: coverage gate (95% per crate)
        entry: scripts/check-coverage.sh
        language: script
        pass_filenames: false
        files: '\.rs$'
        # Tier 1 alone carries the 95% number, so coverage never waits on
        # Docker. Budget for the whole pre-commit run is 2 minutes; see
        # standards/testing.md for what keeps it there.

      - id: task-id
        name: commit subject references a backlog task
        entry: scripts/check-commit-msg.sh
        language: script
        stages: [commit-msg]

      # commit-msg rather than pre-commit, because the escape hatch is a line in
      # the message and the check has to read it. M13.2.
      - id: tests-kept
        name: a removed test is declared
        entry: scripts/check-tests-kept.sh
        language: script
        stages: [commit-msg]

      # Non-negotiable 7. Runs on every commit rather than per-crate, because
      # the whole workspace scan takes well under a second. M13.3.
      # Non-negotiable 6. Reads the index, so it only runs where a commit is
      # being made: CI has no staged change to inspect. M13.5.
      - id: core-contract
        name: a core trait change arrives whole
        entry: scripts/check-core-contract.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]

      # Non-negotiable 5. Whole-workspace scan, well under a second. M13.4.
      - id: sans-io
        name: business logic is sans-I/O
        entry: scripts/check-sans-io.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]

      - id: secrets-not-formatted
        name: no exposed credential reaches a formatter
        entry: scripts/check-secrets.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]

      - id: coverage-full
        name: coverage gate, whole workspace
        entry: scripts/check-coverage.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]
