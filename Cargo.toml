[workspace]
resolver = "3"
members = ["crates/pgprox-core", "crates/pgprox-proto", "crates/pgprox-tls", "crates/pgprox-auth", "crates/pgprox-testkit", "crates/pgprox-cluster", "crates/pgprox-route", "crates/pgprox-pool", "crates/pgprox-config", "crates/pgprox-cache", "crates/pgprox-load", "crates/pgprox-observe", "crates/pgprox-admin", "crates/pgprox-session", "bin/pgprox", "bin/pgload"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/pgprox/pgprox"
# An application, not a library set. Nothing here goes to crates.io, and saying
# so is what lets path dependencies be path dependencies.
publish = false

[workspace.dependencies]
async-trait = "0.1"
tokio = { version = "1", default-features = false }
proptest = "1"
thiserror = "2"
# SIMD null-byte search. The wire protocol is null-terminated strings and
# little else, so every string field this proxy reads is one of these scans:
# the SQL of every Query and Parse, both halves of every ParameterStatus, every
# CommandComplete tag, and every field of every error. It has no dependencies
# of its own.
#
# Default features, which means std, and that is the point rather than an
# oversight: without std memchr falls back to SSE2 only, because selecting AVX2
# needs the runtime feature detection that lives in std. This crate is std
# already.
memchr = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
serde = { version = "1", default-features = false }
# Archived upstream and kept anyway: it clears this project's own supply-chain
# gate, and a config document arrives from a mounted ConfigMap an operator
# controls rather than from the internet. cargo-deny runs in pre-commit and CI,
# so the day an advisory is filed the build fails and we move.
serde_yaml = "0.9"
tempfile = "3"
serde_json = "1"
# Axum without its default features: no multipart, no forms, no static file
# serving. An admin API needs JSON and query parameters, and every feature it
# does not have is a parser that cannot be reached from a socket.
axum = { version = "0.8", default-features = false }
# The OpenAPI document is generated from the handlers, so tooling and agents get
# a typed contract rather than scraped text. See ADR 0007.
utoipa = "5"
tower = { version = "0.5", default-features = false }
http-body-util = "0.1"
# Structured logging. The span and field conventions are pgprox-observe's; this
# is the machinery that carries them.
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "json"] }

[workspace.lints.rust]
# No unsafe anywhere. If the buffer slab or the codec appears to need it, that
# is a design review, not a local allow. See standards/rust-style.md.
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# A proxy fails in front of a customer's database. An invariant you are certain
# of is either encodable in the type or worth a real error.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Allowed from pedantic, each with a reason. Keep this list short; every entry
# is a rule we decided not to follow, and it should be defensible.
#
# module_name_repetitions: `pool::PoolError` reads better than `pool::Error` at
#   the call site, where the module is rarely in scope.
# missing_errors_doc / missing_panics_doc: the error type is in the signature
#   and says more than prose would. Panics are denied outright anyway.
# must_use_candidate: too noisy on a contracts crate that is nearly all types.
# duration_suboptimal_units: suggests Duration::from_mins and from_hours, which
#   are newer than our pinned MSRV. Adopting them would raise the floor for a
#   readability gain, and the FIPS build image is the reason the floor is pinned
#   at all. Revisit when MSRV moves for a real reason.
module_name_repetitions = "allow"
duration_suboptimal_units = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.test]
# The simulation and property tests are compute-bound. Unoptimized builds cost
# more in run time than they save in compile time. See standards/testing.md.
opt-level = 1

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
