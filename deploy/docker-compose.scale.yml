# What a scale run changes about the e2e stack, and nothing else.
#
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up
#
# Three differences, each with a reason a measurement needs:
#
#   1. A higher client cap. The shipped document allows 200 connections per
#      node, which is the right number for an e2e run and refuses the 201st
#      connection of a scale run.
#   2. Plaintext on pgprox-1. `bin/pgload` does not speak TLS yet, and the
#      comparison a scale run makes is proxy-hop against direct-hop, so both
#      sides of it have to be the same on that axis. The other two nodes keep
#      requiring TLS, so the stack still holds the posture M6 asserts.
#   3. Published ports. The load client runs on the host rather than in a
#      container, so that the memory it uses is not counted in the memory the
#      proxy uses.
#
# The upstream cap is deliberately not raised. A thousand clients multiplexed
# onto sixty upstream connections is the property being measured.

services:
  # Where the load comes from at high connection counts: inside the network,
  # with the container's own ephemeral port range and file descriptor limit,
  # and without the published-port forwarder in the path.
  loadgen:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      pgprox-1:
        condition: service_healthy
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ../docs/internal/product/perf:/workload:ro
      - ../target/scale:/out
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    sysctls:
      # The whole unprivileged range, because this container's limit is the
      # measurement's limit. The default 32768-60999 is 28,231 ports, and a
      # client opening twenty thousand connections exhausts it as soon as any
      # of them churn: the failure is `Cannot assign requested address`, which
      # looks like the proxy refusing and is the load generator running out.
      net.ipv4.ip_local_port_range: "1024 65000"
      # Reuse a TIME_WAIT port for a new outbound connection, which is safe for
      # a client and is what makes a churning run sustainable.
      net.ipv4.tcp_tw_reuse: "1"

  primary:
    ports:
      - "15432:5432"

  pgprox-1:
    # Bigger than the stack-wide 65536, because this is the node under test and
    # a scale run puts every client on it.
    #
    # What is deliberately not set here is the socket buffer minimum. Kernel
    # memory per socket does not go away with the userspace buffer slab: at
    # 100k sockets `net.ipv4.tcp_rmem` and `tcp_wmem` minimums of 4 KiB each
    # are 800 MB of kernel memory that no proxy design avoids, and they are a
    # sysctl on the host rather than a container setting. A compose file that
    # pretended otherwise would be teaching the wrong thing; the pod spec is
    # where that belongs, in M8.
    environment:
      PGPROX_CONFIG: /etc/pgprox/scale.yaml
      # A space rather than an empty string: the entrypoint expands this
      # unquoted, and `:-` would substitute the default for an empty value.
      PGPROX_REQUIRE_TLS: " "
      # Info by default: a measurement run must not be measuring its own
      # logging. Raise it when investigating, which is what found M7.36:
      #
      #   SCALE_LOG=debug scripts/scale.sh 1000
      #
      # It goes here rather than on the compose anchor because a service's own
      # `environment` block replaces the anchor's rather than merging with it,
      # so a setting there never reached this node at all.
      RUST_LOG: "${SCALE_LOG:-info}"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    sysctls:
      # The proxy asks to listen with a backlog of 8192 and the kernel trims it
      # to this. The stock 4096 is not enough for a ten-thousand-connection
      # ramp: the queue overflows and the client sees a socket that closed with
      # nothing on it, which is indistinguishable from a proxy bug and was
      # mistaken for one in M7.37.
      net.core.somaxconn: "16384"
