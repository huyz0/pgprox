# Defaults for the pgprox chart.
#
# Rendering this chart with no overrides produces a manifest that is valid and
# will not serve traffic, because two things cannot have a sensible default: a
# credential sidecar image, which is not ours to pick, and an upstream server
# list, which is the deployment. Both are called out in NOTES.txt so the gap is
# visible at install rather than in a crash loop.

image:
  repository: pgprox
  # The default image. The FIPS variant is a separate tag built from the
  # `fips` stage of deploy/Dockerfile; see values-fips.yaml for what changes.
  tag: ""
  pullPolicy: IfNotPresent

# Three, for the same reason the e2e stack runs three: quota leasing, gossip
# and cross-node cancellation all behave differently with one node.
replicaCount: 3

ports:
  client: 6432
  admin: 9090
  gossip: 6433

drain:
  # One number, used three ways: it is `drain_grace` in the config document,
  # it is how long the preStop hook waits, and terminationGracePeriodSeconds
  # is derived from it. Writing the wait as a literal somewhere is how a chart
  # ends up SIGTERMing a node halfway through its own drain.
  graceSeconds: 60
  # Headroom between the end of the preStop wait and SIGTERM. The kubelet
  # counts the grace period from when it starts the hook, not from when the
  # hook returns, so without this the two race.
  terminationHeadroomSeconds: 15

# The credential sidecar. Not ours: it validates the JWT and returns the real
# backend. The proxy talks to it over a Unix socket in a shared emptyDir and
# refuses to start without it, which is correct behaviour for a node that
# cannot resolve credentials.
sidecar:
  image: ""
  # Empty means the same policy as the proxy image, which is right when both
  # come from the same registry and wrong nowhere that matters.
  pullPolicy: ""
  # Only needed when the sidecar image's entrypoint is not the sidecar, which
  # is the case for any image that carries more than one binary.
  command: []
  args: ["/run/pgprox/sidecar.sock"]
  # Whatever the sidecar needs to reach the control plane. Left to the operator
  # because the shape is the sidecar's, not this chart's.
  env: []
  resources: {}

# Frontend TLS. Required whenever JWT auth is in use, because the token travels
# in the password field. Naming a secret here turns on --require-tls; leaving
# it empty produces a node that will refuse every JWT client it sees.
tls:
  secretName: ""
  certKey: tls.crt
  keyKey: tls.key

# The config document, mounted as a ConfigMap and watched for changes. The
# file provider watches the mount directory rather than the file, because a
# ConfigMap update swaps a symlink and a watch on the file itself misses it.
config:
  maxClientConns: 5000
  grantTtlCap: 300s
  # The upstream servers and their caps. Empty on purpose: the numbers here
  # are the deployment, and a default would be a guess that looks like a
  # recommendation.
  servers: []
  #  - server: postgres.internal:5432
  #    max_connections: 4800
  #    guaranteed_fraction: 0.3

  # The query result cache. Off, and off means no tenant listed.
  #
  # It promises bounded staleness and nothing stronger: an entry may be up to
  # its TTL old, and a write through another proxy node or straight into the
  # database is not something this node can see. Listing a tenant here is that
  # tenant saying reads this old are acceptable for its workload, so it is not
  # a decision to make on their behalf. See ADR 0021.
  queryCache:
    maxBytes: 64MiB
    # The largest single answer the proxy will hold on the chance it is
    # cacheable. A different resource from maxBytes: that is one figure for the
    # store, this is a buffer spent per session while an answer is in flight,
    # so it is multiplied by however many sessions are recording at once.
    # Raising maxBytes alone does not let a larger result be cached.
    maxEntryBytes: 1MiB
    # The ceiling on any tenant's ttl below, whatever it asks for.
    ttlCap: 30s
    tenants: {}
    #  acme: { ttl: 5s }

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    memory: 1Gi

# Kernel settings, and why this is empty rather than helpful.
#
# The one worth setting is net.core.somaxconn. The proxy asks to listen with a
# backlog of 8192 and the kernel trims it to this; the stock 4096 is not enough
# for a large reconnect burst, and the overflow looks to a client like a socket
# that closed with nothing on it. M7 mistook it for a proxy bug.
#
# It is not on the kubelet's safe list. A pod asking for it on a cluster whose
# kubelet was not started with --allowed-unsafe-sysctls=net.core.somaxconn does
# not fail to tune, it fails to start, with SysctlForbidden and nothing else.
# So it goes here, off, for an operator who knows their kubelet:
#
#   sysctls:
#     - name: net.core.somaxconn
#       value: "16384"
sysctls: []

# 100k connections is a file descriptor each, plus upstream connections, peers
# and listeners. The container's own limit is what has to be raised; a node
# that hits it refuses clients for a reason that looks nothing like the truth.
# Like the sysctl above, this is not something a pod spec can ask for: it is a
# container runtime setting. NOTES.txt says how to check it.
nofile: 262144

podDisruptionBudget:
  enabled: true
  minAvailable: 2

service:
  type: ClusterIP
  annotations: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
