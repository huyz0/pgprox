; The pgbouncer arm of the comparison. `M32.2`.
;
; Every setting here that is not a default is one of the ways the three arms are
; held equal. The list is in deploy/docker-compose.compare.yml, and
; scripts/compare.sh reads the numbers out of this file rather than trusting it.

[databases]
tenant_acme = host=primary port=5432 dbname=tenant_acme

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; SCRAM, which is what bin/pgload learned in M32.1. The password is in
; userlist.txt in the clear because pgbouncer derives the verifier from it, and
; because this is a test stack whose database password is in a compose file
; three directories up.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; The comparison is about transaction pooling.
pool_mode = transaction

; Sixty, the same cap deploy/config/scale.yaml gives pgprox. Both settings,
; because default_pool_size is per user-database pair and max_db_connections is
; the ceiling across them, and the run needs the ceiling to be the number.
default_pool_size = 60
max_db_connections = 60
min_pool_size = 0

; A client cap a comparison will not reach, matching what the pgprox arm is
; configured with rather than leaving pgbouncer's default of 100 to refuse the
; hundred and first connection and call it a result.
max_client_conn = 150000

; Protocol-level prepared statements, which the workload uses because every real
; driver does. Without this every named Parse fails and the arm reports a
; catastrophe that is a missing line of configuration. M32.6 nearly published
; exactly that about pgcat.
max_prepared_statements = 500

; Empty, because transaction pooling does not need a reset query and running
; DISCARD ALL on every release would measure a round trip the other two arms do
; not make. pgbouncer's own documentation says to leave it empty in this mode.
server_reset_query =

; bin/pgload sends application_name in its startup packet, and pgbouncer refuses
; unknown startup parameters by default rather than passing them through.
ignore_startup_parameters = extra_float_digits,application_name
