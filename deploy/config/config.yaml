# The configuration every node in the e2e stack reads.
#
# One document for the fleet, with per-node overrides, because that is how a
# ConfigMap works: the same mount on every pod, and a node finds itself in it
# by name.
max_client_conns: 200
drain_grace: 10s
grant_ttl_cap: 300s

servers:
  - server: primary:5432
    max_connections: 60
    guaranteed_fraction: 0.5

nodes:
  pgprox-1: {}
  pgprox-2: {}
  pgprox-3: {}

# The query cache, shown and left off.
#
# Off is the default and this stack keeps it, because e2e checks what the
# proxy does with statements and a cached read is a statement the database
# never sees. Turning it on here would change what those checks measure rather
# than add a check. `M9.10` measures the cache against the scale workload,
# which is where the question is whether it helps.
#
# query_cache:
#   max_bytes: 64MiB
#   ttl_cap: 30s
#   tenants:
#     acme: { ttl: 5s }
