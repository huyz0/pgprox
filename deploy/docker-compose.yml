# The e2e stack: three proxy nodes, a primary, two replicas, a sidecar each.
#
# The shape is the deployment shape rather than the smallest thing that would
# run. Three nodes because quota, gossip and cancellation all behave
# differently with one. Two replicas because one cannot show a read being
# steered away from a replica that has fallen behind. A sidecar per node
# because that is how it ships: over a Unix socket in the same pod, never over
# the network.

name: pgprox-e2e

x-proxy: &proxy
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  depends_on:
    primary:
      condition: service_healthy
  volumes:
    - ./config:/etc/pgprox:ro
  environment:
    # Where the mock sidecar sends every tenant. A real sidecar reads this from
    # the control plane; the mock is told.
    PGPROX_MOCK_PRIMARY: primary:5432
    PGPROX_MOCK_REPLICAS: replica-1:5432,replica-2:5432
    PGPROX_MOCK_DATABASE: tenant_acme
    PGPROX_MOCK_USER: acme_app
    PGPROX_MOCK_PASSWORD: acme-password
    PGPROX_MOCK_TLS: disabled
  # A file descriptor per client connection, per upstream connection, per peer
  # and per listener. The default soft limit of 1024 is a node that refuses its
  # 1000th client for a reason that looks nothing like the truth in a log, so
  # it is raised here rather than discovered under load.
  #
  # 65536 is right for the e2e stack and for a scale run at a few thousand. A
  # node aiming at the roadmap's 100k needs 262144, which is what
  # `docs/internal/product/plan.md` says and what a Kubernetes deployment sets in its pod
  # spec; setting it that high here would only hide the fact that the number
  # has to be chosen per deployment.
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  # The sidecar and the proxy share a pod in production, which here is one
  # container running both over a socket neither exposes.
  entrypoint:
    - /bin/sh
    - -c
    - |
      # A self-signed certificate per node, made at start. A test stack that
      # shipped a checked-in key would be a test stack with a private key in
      # git, and the property under test is that TLS is terminated at all.
      openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
        -subj "/CN=$${PGPROX_NODE_NAME}" \
        -addext "subjectAltName=DNS:$${PGPROX_NODE_NAME},DNS:localhost" \
        -keyout /tmp/tls.key -out /tmp/tls.crt >/dev/null 2>&1

      # The socket from a previous life, if this container is being restarted
      # rather than created. The wait below tests for the file, so a stale one
      # satisfies it instantly and the proxy then fails to connect and exits:
      # `docker compose restart pgprox-1` killed the node every time.
      rm -f /tmp/sidecar.sock
      /usr/local/bin/mock_sidecar /tmp/sidecar.sock &
      # The proxy refuses to start without its sidecar, which is right: a node
      # that cannot resolve credentials authenticates nobody. In a pod the
      # kubelet restarts it until the sidecar is up; here the two share a
      # container, so waiting is both simpler and closer to the intent.
      for _ in $$(seq 1 60); do
        [ -S /tmp/sidecar.sock ] && break
        sleep 0.5
      done

      # And the upstream CA, on the node that has one. `depends_on` is not
      # enough by itself: the primary answers pg_isready from the temporary
      # server its own init scripts run against, so "healthy" arrives before
      # those scripts have finished. The replica entrypoint already works
      # around the same window, and says so.
      if [ -n "$${PGPROX_UPSTREAM_CA:-}" ]; then
        for _ in $$(seq 1 120); do
          [ -s /upstream-tls/ca.crt ] && break
          sleep 0.5
        done
        if [ ! -s /upstream-tls/ca.crt ]; then
          echo "no upstream CA at /upstream-tls/ca.crt" >&2
          exit 1
        fi
      fi
      # Both parameterised so a measurement run can use a different document
      # and speak plaintext, without a second copy of this entrypoint that
      # would drift from it. The defaults are the posture the e2e run asserts:
      # the shipped config, and TLS required.
      #
      # `PGPROX_INSECURE_PLAINTEXT_AUTH` travels with `PGPROX_REQUIRE_TLS`
      # rather than defaulting on: `M88.7` refuses to start with JWT auth
      # reachable and TLS not required unless this says that was chosen on
      # purpose, and the two measurement overlays that turn `--require-tls`
      # off are the only place this repo sets it.
      exec /usr/local/bin/pgprox \
        --config "$${PGPROX_CONFIG:-/etc/pgprox/config.yaml}" \
        --sidecar /tmp/sidecar.sock \
        --listen 0.0.0.0:6432 \
        --admin 0.0.0.0:9090 \
        --gossip 0.0.0.0:6433 \
        --tls-cert /tmp/tls.crt \
        --tls-key /tmp/tls.key \
        $${PGPROX_REQUIRE_TLS:---require-tls} \
        $${PGPROX_INSECURE_PLAINTEXT_AUTH:-} \
        $${PGPROX_UPSTREAM_CA:-} \
        --node "$${PGPROX_NODE}" \
        --node-name "$${PGPROX_NODE_NAME}" \
        --peer "$${PGPROX_PEER_A}" \
        --peer "$${PGPROX_PEER_B}"
  healthcheck:
    # The proxy's own readiness, which is what the drain assertion then watches
    # change. A node that is up but not ready is not a node the stack should
    # start running assertions against.
    test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9090/readyz"]
    interval: 2s
    timeout: 2s
    retries: 30

volumes:
  # The upstream certificate authority, and the leaf the databases serve. Made
  # once per stack by the service below and read by the databases and by the one
  # node that dials them over TLS.
  upstream-tls:

services:
  # A CA and a server certificate, then it exits. The postgres image has no
  # openssl, and the proxy image does because its own entrypoint makes a
  # certificate with it, so this borrows that rather than adding a third image.
  #
  # It exists at all because the proxy's upstream side has no "verify nothing"
  # mode: proving that path reaches a Postgres needs a chain that verifies, and
  # a self-signed server certificate is refused as a CA used as a leaf.
  upstream-tls:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/bin/sh", "/generate.sh"]
    volumes:
      - ./upstream-tls/generate.sh:/generate.sh:ro
      - upstream-tls:/upstream-tls
    restart: "no"

  primary:
    image: postgres:17-alpine
    depends_on:
      upstream-tls:
        condition: service_completed_successfully
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./primary/tls.sh:/docker-entrypoint-initdb.d/05-tls.sh:ro
      - ./primary/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - upstream-tls:/upstream-tls:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  replica-1: &replica
    image: postgres:17-alpine
    depends_on:
      primary:
        condition: service_healthy
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      PRIMARY_HOST: primary
    user: postgres
    entrypoint: ["/bin/bash", "/replica-entrypoint.sh"]
    volumes:
      - ./replica/entrypoint.sh:/replica-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  replica-2:
    <<: *replica

  pgprox-1:
    <<: *proxy
    environment:
      PGPROX_NODE: "1"
      PGPROX_NODE_NAME: pgprox-1
      PGPROX_PEER_A: 2=pgprox-2:6433
      PGPROX_PEER_B: 3=pgprox-3:6433
      PGPROX_MOCK_PRIMARY: primary:5432
      PGPROX_MOCK_REPLICAS: replica-1:5432,replica-2:5432
      PGPROX_MOCK_DATABASE: tenant_acme
      PGPROX_MOCK_USER: acme_app
      PGPROX_MOCK_PASSWORD: acme-password
      PGPROX_MOCK_TLS: disabled
    ports:
      - "16432:6432"
      - "19090:9090"

  pgprox-2:
    <<: *proxy
    environment:
      PGPROX_NODE: "2"
      PGPROX_NODE_NAME: pgprox-2
      PGPROX_PEER_A: 1=pgprox-1:6433
      PGPROX_PEER_B: 3=pgprox-3:6433
      PGPROX_MOCK_PRIMARY: primary:5432
      PGPROX_MOCK_REPLICAS: replica-1:5432,replica-2:5432
      PGPROX_MOCK_DATABASE: tenant_acme
      PGPROX_MOCK_USER: acme_app
      PGPROX_MOCK_PASSWORD: acme-password
      PGPROX_MOCK_TLS: disabled
    ports:
      - "16433:6432"
      - "19091:9090"

  # The node whose upstream connections are encrypted.
  #
  # One of the three rather than all of them, so the stack keeps a node on each
  # side of the choice: `TlsMode::Disabled` is what the other two exercise, and
  # a failure here names the mode rather than taking the whole fleet with it.
  # This is also the node the watermark assertion already drives, so the TLS
  # path carries real traffic rather than one probe.
  #
  # `M79.0`. Every service in this file set `PGPROX_MOCK_TLS: disabled`, which
  # meant the proxy's *default* upstream mode had never been pointed at a
  # Postgres. It could not have reached one: it sent a TLS ClientHello where the
  # protocol wants an `SSLRequest`, which `M75.0` fixed and nothing here could
  # have caught.
  pgprox-3:
    <<: *proxy
    depends_on:
      primary:
        condition: service_healthy
      upstream-tls:
        condition: service_completed_successfully
    volumes:
      - ./config:/etc/pgprox:ro
      - upstream-tls:/upstream-tls:ro
    environment:
      PGPROX_NODE: "3"
      PGPROX_NODE_NAME: pgprox-3
      PGPROX_PEER_A: 1=pgprox-1:6433
      PGPROX_PEER_B: 2=pgprox-2:6433
      PGPROX_MOCK_PRIMARY: primary:5432
      PGPROX_MOCK_REPLICAS: replica-1:5432,replica-2:5432
      PGPROX_MOCK_DATABASE: tenant_acme
      PGPROX_MOCK_USER: acme_app
      PGPROX_MOCK_PASSWORD: acme-password
      # Anything but `disabled`, which is how the mock sidecar spells the
      # default a real one returns when it says nothing.
      PGPROX_MOCK_TLS: verified
      # Whole flag and argument in one variable, so a node without one expands
      # to nothing rather than to an empty path. The same shape as
      # PGPROX_REQUIRE_TLS above it.
      PGPROX_UPSTREAM_CA: --upstream-ca /upstream-tls/ca.crt
    ports:
      - "16434:6432"
      - "19092:9090"

  # Where pgbench and psql run from, so the e2e script needs no Postgres client
  # installed on the machine running it.
  client:
    image: postgres:17-alpine
    depends_on:
      pgprox-1:
        condition: service_healthy
    entrypoint: ["sleep", "infinity"]
